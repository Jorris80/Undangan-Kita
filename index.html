<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<!-- UndangKita v2.0.0 · Pustaka pihak ketiga: qrcode-generator (MIT, Kazuhiko Arase) · jsQR (Apache-2.0, Cosmo Wolfe) · Font: Plus Jakarta Sans, Cormorant Garamond, Alex Brush (SIL OFL 1.1). "QR Code" adalah merek dagang DENSO WAVE INCORPORATED. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#22304A">
<title>UndangKita — Undangan Pernikahan Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">

<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Undangan pernikahan digital dengan RSVP, QR check-in dan buku tamu.">
<script src="config.js"></script>
<style>
/* ===== UndangKita v2 — token desain panel (tinta nila + janur) ===== */
:root{
  --tinta:#22304A; --tinta-2:#34466B; --kertas:#F4F5F1; --permukaan:#FFFFFF; --garis:#DDE0D6;
  --teks:#1F2633; --redup:#5B6475; --janur:#B8A13A; --janur-teks:#6E5F14; --janur-lembut:#F3EFD8;
  --sirih:#2F6B4A; --sirih-lembut:#E4F1E8; --kesumba:#A3303F; --kesumba-lembut:#F8E4E6;
  --kunyit:#8A5A00; --kunyit-lembut:#FBF0D9; --biru:#2D5F8B; --biru-lembut:#E3EDF7; --ungu:#5B3F8C; --ungu-lembut:#EEE8F7;
  --r1:6px; --r2:12px; --r3:18px; --bayang:0 1px 2px rgba(34,48,74,.08),0 4px 14px rgba(34,48,74,.06);
  --sans:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif; --skrip:'Alex Brush','Segoe Script',cursive;
  --aman-atas:env(safe-area-inset-top,0px); --aman-bawah:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--sans);font-size:15px;line-height:1.5;color:var(--teks);background:var(--kertas)}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--biru)}
:focus-visible{outline:3px solid var(--janur);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tersembunyi{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Tombol & isian ---------- */
.tbl{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 14px;border-radius:var(--r2);border:1px solid var(--garis);background:var(--permukaan);color:var(--teks);font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.tbl:hover{border-color:#c5c9bd}
.tbl:disabled{opacity:.55;cursor:not-allowed}
.tbl.utama{background:var(--tinta);border-color:var(--tinta);color:#fff}
.tbl.utama:hover{background:var(--tinta-2)}
.tbl.hijau{background:var(--sirih);border-color:var(--sirih);color:#fff}
.tbl.bahaya{color:var(--kesumba);border-color:#e7c3c7}
.tbl.bahaya.penuh{background:var(--kesumba);color:#fff;border-color:var(--kesumba)}
.tbl.kecil{min-height:32px;padding:4px 10px;font-size:13px;border-radius:var(--r1)}
.tbl.ikon{width:36px;min-height:36px;padding:0}
.tbl.lebar{width:100%}
.tbl svg{width:17px;height:17px;flex:none}
label.lbl{display:block;font-size:13px;font-weight:600;margin:0 0 4px;color:var(--teks)}
.isian,select.isian,textarea.isian{width:100%;min-height:42px;padding:9px 11px;border:1px solid var(--garis);border-radius:var(--r1);background:#fff;font-size:15px}
textarea.isian{min-height:84px;resize:vertical}
.isian:focus{border-color:var(--tinta-2);outline:none;box-shadow:0 0 0 3px rgba(52,70,107,.15)}
.bantu{font-size:12.5px;color:var(--redup);margin-top:4px}
.kisi{display:grid;gap:12px}
@media(min-width:640px){.k2{grid-template-columns:1fr 1fr}.k3{grid-template-columns:repeat(3,1fr)}.k4{grid-template-columns:repeat(4,1fr)}}
.baris{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.baris.antara{justify-content:space-between}
.tumbuh{flex:1;min-width:0}
.cek{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer}
.cek input{width:18px;height:18px;margin-top:2px;accent-color:var(--tinta)}

/* ---------- Kerangka panel ---------- */
.atas{position:sticky;top:0;z-index:30;background:var(--permukaan);border-bottom:1px solid var(--garis);padding-top:var(--aman-atas)}
.atas-dalam{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:11px;background:var(--tinta);color:var(--janur-lembut);display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:18px;flex:none;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.merek b{display:block;font-size:15.5px;line-height:1.2}
.merek span{font-size:12.5px;color:var(--redup)}
.tab-atas{max-width:1180px;margin:0 auto;padding:0 12px 8px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab-atas::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:var(--r1);border:0;background:none;color:var(--redup);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.tab svg{width:17px;height:17px}
.tab[aria-current=page]{background:var(--janur-lembut);color:var(--tinta)}
.bawah{display:none}
main.isi{max-width:1180px;margin:0 auto;padding:18px 16px 40px}
@media(max-width:760px){
  .tab-atas{display:none}
  .bawah{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--permukaan);border-top:1px solid var(--garis);padding:4px 4px calc(4px + var(--aman-bawah));overflow-x:auto}
  .bawah .tab{flex:1 0 64px;flex-direction:column;gap:2px;font-size:11px;padding:6px 4px}
  .bawah .tab svg{width:21px;height:21px}
  main.isi{padding:14px 12px calc(86px + var(--aman-bawah))}
  .merek span{display:none}
  body{font-size:15px}
}
.pita{padding:9px 16px;font-size:13.5px;text-align:center}
.pita.merah{background:var(--kesumba);color:#fff}
.pita.kuning{background:var(--kunyit-lembut);color:var(--kunyit);border-bottom:1px solid #eedcb0}
.pita.abu{background:#333b48;color:#fff}

/* ---------- Kartu & statistik ---------- */
.kartu{background:var(--permukaan);border:1px solid var(--garis);border-radius:var(--r2);padding:16px;box-shadow:var(--bayang)}
.kartu+.kartu{margin-top:14px}
.judul-hal{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.judul-hal h1{font-size:21px;margin:0;line-height:1.25}
.judul-hal p{margin:2px 0 0;color:var(--redup);font-size:13.5px}
h2.sub{font-size:16px;margin:0 0 10px}
.statistik{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:900px){.statistik{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--permukaan);border:1px solid var(--garis);border-radius:var(--r2);padding:12px 14px}
.stat .angka{font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .ket{font-size:12.5px;color:var(--redup)}
.stat .lbl2{font-size:13px;font-weight:600;color:var(--redup)}
.corong{display:grid;gap:10px}
.corong .bar{height:10px;background:#ECEEE8;border-radius:10px;overflow:hidden}
.corong .bar i{display:block;height:100%;background:var(--tinta);border-radius:10px}
.lencana{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:#EEF0EA;color:var(--redup);white-space:nowrap}
.lencana.hijau{background:var(--sirih-lembut);color:var(--sirih)}
.lencana.merah{background:var(--kesumba-lembut);color:var(--kesumba)}
.lencana.kuning{background:var(--kunyit-lembut);color:var(--kunyit)}
.lencana.biru{background:var(--biru-lembut);color:var(--biru)}
.lencana.ungu{background:var(--ungu-lembut);color:var(--ungu)}
.lencana.janur{background:var(--janur-lembut);color:var(--janur-teks)}
.kosong{text-align:center;padding:30px 12px;color:var(--redup)}

/* ---------- Tabel & daftar tamu ---------- */
.tabel-wrap{overflow-x:auto;border:1px solid var(--garis);border-radius:var(--r2);background:#fff}
table.tabel{width:100%;border-collapse:collapse;font-size:13.5px}
.tabel th{text-align:left;font-weight:600;color:var(--redup);background:#F8F9F5;padding:9px 10px;border-bottom:1px solid var(--garis);white-space:nowrap}
.tabel td{padding:9px 10px;border-bottom:1px solid #EEF0EA;vertical-align:top}
.tabel tr:last-child td{border-bottom:0}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.daftar-kartu{display:none}
@media(max-width:760px){
  .tabel-wrap.responsif{display:none}
  .daftar-kartu{display:grid;gap:10px}
}
.tamu-kartu{background:#fff;border:1px solid var(--garis);border-radius:var(--r2);padding:12px}
.tamu-kartu .nama{font-weight:700;font-size:15px}
.tamu-kartu .meta{font-size:12.5px;color:var(--redup);margin:2px 0 8px}
.aksi-baris{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- Modal & toast ---------- */
.latar{position:fixed;inset:0;z-index:60;background:rgba(20,26,38,.55);display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:640px){.latar{align-items:center;padding:20px}}
.modal{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + var(--aman-bawah));box-shadow:0 20px 50px rgba(0,0,0,.25)}
@media(min-width:640px){.modal{border-radius:var(--r3)}}
.modal.lebar{max-width:820px}
.modal-kepala{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.modal-kepala h3{margin:0;font-size:17px}
.modal-kaki{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.toast-wadah{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + var(--aman-bawah));z-index:80;display:grid;gap:8px;width:min(92vw,420px)}
.toast{background:#1F2633;color:#fff;padding:11px 14px;border-radius:var(--r2);font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.galat{background:var(--kesumba)}
.toast.sukses{background:var(--sirih)}

/* ---------- Login ---------- */
.gerbang{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--tinta);color:#fff;padding:calc(16px + var(--aman-atas)) 16px calc(16px + var(--aman-bawah))}
.gerbang .kotak{background:#fff;color:var(--teks);border-radius:var(--r3);width:100%;max-width:460px;margin:auto;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.gerbang .kepala-g{padding:22px 22px 14px;border-bottom:1px solid var(--garis)}
.gerbang .kepala-g h1{font-family:var(--serif);font-size:30px;margin:4px 0 0;line-height:1.1;color:var(--tinta)}
.gerbang .kepala-g p{margin:6px 0 0;color:var(--redup);font-size:14px}
.gerbang .tubuh-g{padding:18px 22px 22px}
.pilih-peran{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.peran{border:1px solid var(--garis);border-radius:var(--r2);padding:10px;text-align:left;background:#fff;cursor:pointer}
.peran b{display:block;font-size:14px}
.peran span{font-size:12px;color:var(--redup);line-height:1.35;display:block}
.peran[aria-pressed=true]{border-color:var(--tinta);box-shadow:inset 0 0 0 1px var(--tinta);background:#F7F8FB}
.saklar{display:flex;background:#EEF0EA;border-radius:var(--r2);padding:4px;margin-bottom:16px}
.saklar button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font-weight:600;font-size:14px;cursor:pointer;color:var(--redup)}
.saklar button[aria-pressed=true]{background:#fff;color:var(--tinta);box-shadow:var(--bayang)}
.pin-isian{font-size:24px;letter-spacing:.4em;text-align:center;font-family:ui-monospace,monospace}

/* ---------- Check-in ---------- */
.gerbang-cek{display:grid;gap:14px}
@media(min-width:900px){.gerbang-cek{grid-template-columns:7fr 5fr}}
.pindai-isian{font-size:18px;min-height:52px}
.video-wadah{position:relative;background:#000;border-radius:var(--r2);overflow:hidden;aspect-ratio:1/1;max-height:60vh}
.video-wadah video{width:100%;height:100%;object-fit:cover}
.video-wadah .bingkai{position:absolute;inset:18%;border:3px solid rgba(255,255,255,.85);border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.hasil-cek{border-radius:var(--r2);padding:16px;border:2px solid}
.hasil-cek.SUCCESS{background:var(--sirih-lembut);border-color:var(--sirih)}
.hasil-cek.ALREADY_CHECKED_IN{background:var(--kesumba-lembut);border-color:var(--kesumba)}
.hasil-cek.NOT_FOUND,.hasil-cek.ANTRE{background:var(--kunyit-lembut);border-color:var(--kunyit)}
.hasil-cek .besar{font-size:22px;font-weight:700;margin:4px 0}
.meja-besar{font-size:30px;font-weight:800;color:var(--tinta);font-family:var(--serif)}
.pax-pilih{display:flex;gap:6px;flex-wrap:wrap}
.pax-pilih button{min-width:48px;min-height:44px;border-radius:var(--r1);border:1px solid var(--garis);background:#fff;font-weight:700;cursor:pointer}
.pax-pilih button[aria-pressed=true]{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.umpan{max-height:520px;overflow:auto;display:grid;gap:8px}
.umpan .item{border:1px solid var(--garis);border-radius:var(--r1);padding:9px 11px;background:#fff}

/* ---------- Pengaturan ---------- */
details.bagian{background:#fff;border:1px solid var(--garis);border-radius:var(--r2);margin-bottom:10px}
details.bagian>summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
details.bagian>summary::-webkit-details-marker{display:none}
details.bagian>summary::after{content:'+';font-size:20px;color:var(--redup)}
details.bagian[open]>summary::after{content:'–'}
details.bagian>.dalam{padding:0 16px 16px}
.pratinjau-foto{width:96px;height:96px;border-radius:var(--r2);object-fit:cover;background:#EEF0EA;border:1px solid var(--garis)}
.galeri-admin{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.galeri-admin .sel{position:relative;border-radius:var(--r1);overflow:hidden;border:1px solid var(--garis);background:#EEF0EA}
.galeri-admin img{width:100%;aspect-ratio:1/1;object-fit:cover}
.galeri-admin .sel button{position:absolute;top:4px;right:4px}
.tema-pilih{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tema-opsi{border:1px solid var(--garis);border-radius:var(--r2);padding:10px;background:#fff;text-align:left;cursor:pointer}
.tema-opsi[aria-pressed=true]{border-color:var(--tinta);box-shadow:inset 0 0 0 1px var(--tinta)}
.tema-opsi .swatch{display:flex;gap:3px;margin-top:6px}
.tema-opsi .swatch i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.1)}
.progres{height:8px;background:#ECEEE8;border-radius:8px;overflow:hidden}
.progres i{display:block;height:100%;background:var(--sirih);width:0;transition:width .2s}
.kode-lisensi{font-family:ui-monospace,monospace;font-size:12px;word-break:break-all}
.wa-pesan{white-space:pre-wrap;font-size:13px;background:#F7F8F4;border:1px solid var(--garis);border-radius:var(--r1);padding:10px;max-height:180px;overflow:auto}

/* =================== UNDANGAN (tema) =================== */
.und{--bg:#f3efe6;--kertas-u:#fffdf8;--tinta-u:#2a1d10;--teks-u:#44382a;--redup-u:#6f6353;--aksen:#9a4a09;--aksen-teks:#fff;--lembut:#f8f1e3;--kartu-u:#ffffff;--garis-u:#e8dcc6;--sampul:linear-gradient(160deg,#1c1917,#3b2a1a 60%,#5b3a14);--sampul-teks:#fef3c7;--sampul-redup:#e7dcc6;--hitung:#1c1917;--bentuk:180px 180px 16px 16px;
  min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--teks-u);font-family:var(--sans)}
.und[data-tema=botani-zamrud]{--bg:#e8f1ec;--kertas-u:#fbfdfb;--tinta-u:#0b3b2e;--teks-u:#23443a;--redup-u:#4e6a60;--aksen:#047857;--lembut:#ecf6f0;--garis-u:#cfe3d8;--sampul:linear-gradient(160deg,#052e25,#064e3b 60%,#0b5f47);--sampul-teks:#d1fae5;--sampul-redup:#b9dccb;--hitung:#064e3b;--bentuk:50%}
.und[data-tema=mawar-senja]{--bg:#f7ecee;--kertas-u:#fffafa;--tinta-u:#4c0519;--teks-u:#5a2a35;--redup-u:#7a5560;--aksen:#b0123a;--lembut:#fdf0f2;--garis-u:#f0d3d9;--sampul:linear-gradient(160deg,#3b0414,#6d0a26 60%,#8f1d3d);--sampul-teks:#ffe4e6;--sampul-redup:#f3c6cf;--hitung:#4c0519;--bentuk:180px 180px 16px 16px}
.und[data-tema=navy-malam]{--bg:#e9edf5;--kertas-u:#fbfcff;--tinta-u:#0f1d3d;--teks-u:#2b3752;--redup-u:#56627c;--aksen:#1e3a8a;--lembut:#eef2fa;--garis-u:#d4dcec;--sampul:linear-gradient(160deg,#070d1d,#0f172a 55%,#1e2e5c);--sampul-teks:#fcd34d;--sampul-redup:#cfd8ec;--hitung:#0f172a;--bentuk:16px}
.und[data-tema=terakota-rustik]{--bg:#f3ebe3;--kertas-u:#fdf9f5;--tinta-u:#3a1306;--teks-u:#51301f;--redup-u:#76584a;--aksen:#b23c0a;--lembut:#f9efe6;--garis-u:#ead7c7;--sampul:linear-gradient(160deg,#2c0d04,#431407 55%,#6e2a10);--sampul-teks:#ffedd5;--sampul-redup:#ecd2bd;--hitung:#431407;--bentuk:50% 50% 16px 16px}
.und[data-tema=noir-editorial]{--bg:#e9e9eb;--kertas-u:#fcfcfc;--tinta-u:#09090b;--teks-u:#27272a;--redup-u:#52525b;--aksen:#18181b;--lembut:#f2f2f3;--garis-u:#dcdce0;--sampul:linear-gradient(160deg,#000,#18181b 60%,#27272a);--sampul-teks:#fafafa;--sampul-redup:#d4d4d8;--hitung:#09090b;--bentuk:4px}
.und .serif{font-family:var(--serif)}
.und .skrip{font-family:var(--skrip);font-weight:400}
.sampul{min-height:100vh;min-height:100dvh;background:var(--sampul);color:var(--sampul-teks);display:flex;align-items:center;justify-content:center;text-align:center;padding:calc(28px + var(--aman-atas)) 20px calc(28px + var(--aman-bawah))}
.sampul .dalam{max-width:420px;width:100%}
.sampul .kecil{letter-spacing:.28em;font-size:12px;color:var(--sampul-redup)}
.sampul h1{font-family:var(--serif);font-size:clamp(40px,11vw,60px);margin:10px 0 6px;line-height:1.05;font-weight:600}
.bingkai-foto{width:min(62vw,230px);aspect-ratio:3/4;margin:18px auto;border-radius:var(--bentuk);overflow:hidden;border:3px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08)}
.bingkai-foto img{width:100%;height:100%;object-fit:cover}
.kotak-tamu{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:16px;margin:16px 0}
.kotak-tamu .nama{font-family:var(--serif);font-size:25px;font-weight:700;margin:4px 0;color:#fff}
.kotak-tamu small{color:var(--sampul-redup)}
.tbl-und{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 22px;border-radius:999px;border:0;background:var(--aksen);color:var(--aksen-teks);font-weight:700;font-size:15px;cursor:pointer;text-decoration:none}
.sampul .tbl-und{background:var(--sampul-teks);color:var(--hitung)}
.tbl-und.garis{background:transparent;color:var(--aksen);box-shadow:inset 0 0 0 1.5px var(--aksen)}
.tbl-und svg{width:18px;height:18px}
.lembar-und{max-width:560px;margin:0 auto;background:var(--kertas-u);min-height:100vh;box-shadow:0 0 40px rgba(0,0,0,.06);padding-bottom:90px}
.bag{padding:44px 22px;text-align:center}
.bag.lembut{background:var(--lembut);border-top:1px solid var(--garis-u);border-bottom:1px solid var(--garis-u)}
.bag h2{font-family:var(--serif);font-size:30px;color:var(--tinta-u);margin:4px 0 8px;line-height:1.15}
.bag .pengantar{font-size:12.5px;letter-spacing:.2em;color:var(--aksen);font-weight:700}
.bag p{color:var(--teks-u)}
.redup-u{color:var(--redup-u);font-size:13.5px}
.kartu-u{background:var(--kartu-u,#fff);border:1px solid var(--garis-u);border-radius:16px;padding:18px;text-align:left}
.kartu-u+.kartu-u{margin-top:12px}
.potret{width:132px;height:132px;border-radius:50%;overflow:hidden;margin:0 auto 12px;border:3px solid var(--garis-u);background:var(--lembut);display:grid;place-items:center;font-family:var(--serif);font-size:44px;color:var(--aksen)}
.potret img{width:100%;height:100%;object-fit:cover}
.amp{font-family:var(--skrip);font-size:46px;color:var(--aksen);margin:6px 0}
.hitung{background:var(--hitung);color:#fff;padding:36px 20px;text-align:center}
.hitung .kisi-h{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:380px;margin:14px auto 0}
.hitung .kisi-h div{background:rgba(255,255,255,.1);border-radius:12px;padding:10px 4px}
.hitung b{display:block;font-family:var(--serif);font-size:30px;font-variant-numeric:tabular-nums}
.hitung small{font-size:11px;opacity:.85}
.peta{width:100%;height:220px;border:0;border-radius:12px;background:var(--lembut)}
.galeri-u{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:520px){.galeri-u{grid-template-columns:repeat(3,1fr)}}
.galeri-u button{padding:0;border:0;border-radius:10px;overflow:hidden;cursor:zoom-in;background:var(--lembut);aspect-ratio:1/1}
.galeri-u img{width:100%;height:100%;object-fit:cover}
.filter-u{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0 14px}
.filter-u button{border:1px solid var(--garis-u);background:#fff;color:var(--teks-u);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.filter-u button[aria-pressed=true]{background:var(--aksen);color:#fff;border-color:var(--aksen)}
.linimasa{text-align:left;position:relative;padding-left:22px}
.linimasa::before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--garis-u)}
.linimasa .titik{position:relative;margin-bottom:18px}
.linimasa .titik::before{content:'';position:absolute;left:-21px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--aksen)}
.pilih-u{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pilih-u button,.pax-u button{border:1px solid var(--garis-u);background:#fff;color:var(--teks-u);border-radius:10px;padding:10px 6px;font-weight:600;cursor:pointer;min-height:44px}
.pilih-u button[aria-pressed=true],.pax-u button[aria-pressed=true]{background:var(--aksen);border-color:var(--aksen);color:#fff}
.pax-u{display:flex;gap:6px;flex-wrap:wrap}
.pax-u button{min-width:54px}
.und .isian{border-color:var(--garis-u)}
.ucapan-u{max-height:340px;overflow:auto;display:grid;gap:8px;text-align:left}
.ucapan-u .item{background:#fff;border:1px solid var(--garis-u);border-radius:12px;padding:12px}
.qr-u{background:#fff;border-radius:14px;padding:14px;display:inline-block;border:1px solid var(--garis-u)}
.qr-u img{width:200px;height:200px;image-rendering:pixelated}
.melayang{position:fixed;right:14px;bottom:calc(14px + var(--aman-bawah));z-index:40;display:flex;gap:8px}
.bulat{width:48px;height:48px;border-radius:50%;border:0;background:var(--hitung);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer}
.bulat svg{width:21px;height:21px}
.bulat.putar svg{animation:putar 4s linear infinite}
@keyframes putar{to{transform:rotate(360deg)}}
.bar-pratinjau{position:sticky;top:0;z-index:45;background:#1F2633;color:#fff;padding:calc(8px + var(--aman-atas)) 12px 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.bar-pratinjau select{background:#2c3444;color:#fff;border:1px solid #475063;border-radius:6px;padding:6px;max-width:48vw}
.kotak-cahaya{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;color:#fff}
.kotak-cahaya img{max-height:78vh;max-width:100%;object-fit:contain;border-radius:8px}
.kotak-cahaya .nav{display:flex;gap:10px;margin-top:12px}
.tanda-air{font-size:12px;color:var(--redup-u);padding:18px;text-align:center}
.tanda-air a{color:var(--aksen)}
.masuk-halus{animation:muncul .6s ease both}
@keyframes muncul{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- Cetak kartu QR ---------- */
#area-cetak{display:none}
@media print{
  body.mencetak>*:not(#area-cetak){display:none!important}
  body.mencetak #area-cetak{display:block!important}
  .kartu-cetak{break-inside:avoid;border:1px dashed #999;border-radius:10px;padding:12px;text-align:center;width:31%;display:inline-block;margin:1%;vertical-align:top;font-family:var(--sans)}
  .kartu-cetak img{width:140px;height:140px;margin:6px auto;image-rendering:pixelated}
  .kartu-cetak b{display:block;font-size:13px}
  .kartu-cetak small{font-size:11px;color:#444}
}
@media(max-width:760px){.sr-m{display:none}}

/* ---------- toast & modal ---------- */
function toast(pesan, jenis) {

  var t = document.createElement('div'); t.className = 'toast ' + (jenis || ''); t.textContent = pesan; w.appendChild(t);
  setTimeout(function () { t.remove(); }, jenis === 'galat' ? 6000 : 3200);
}
function modal(judul, isiHtml, opsi) {
  opsi = opsi || {};

  l.innerHTML = '<div class="modal ' + (opsi.lebar ? 'lebar' : '') + '" role="dialog" aria-modal="true" aria-labelledby="judul-modal"><div class="modal-kepala"><h3 id="judul-modal">' + esc(judul) + '</h3><button class="tbl ikon" data-tutup aria-label="Tutup">' + IK.tutup + '</button></div><div class="modal-isi">' + isiHtml + '</div></div>';
  l.addEventListener('click', function (e) { if (e.target === l || e.target.closest('[data-tutup]')) tutupModal(); });
  document.body.appendChild(l);
  var f = l.querySelector('input:not([type=hidden]),select,textarea'); if (f && !opsi.tanpaFokus) setTimeout(function () { f.focus(); }, 50);
  return l.querySelector('.modal');
}

var PUBLIK = { info: 1, undangan_buka: 1, rsvp_kirim: 1, berkas_ambil: 1, masuk: 1, versi: 1 };
function panggil(aksi, data) {
  data = data || {};
  if (!PUBLIK[aksi]) data.sesi = S.sesi;
  return new Promise(function (ok, gagal) {
    var selesai = false;
    var jaga = setTimeout(function () { if (!selesai) { selesai = true; gagal({ pesan: 'Server tidak menjawab (60 detik). Periksa koneksi lalu coba lagi.', offline: true }); } }, 60000);
    function terima(r) {
      if (selesai) return; selesai = true; clearTimeout(jaga);
      if (r && r.versi) cekVersi(r.versi);
      if (!r || !r.ok) {
        if (r && r.kode === 'SESI') { keluarLokal(); toast(r.pesan, 'galat'); tampilLogin(); }
        gagal(r || { pesan: 'Jawaban server kosong.' }); return;
      }
      ok(r);
    }
    function tolak(e) { if (selesai) return; selesai = true; clearTimeout(jaga); gagal({ pesan: (e && e.message) || String(e), offline: true }); }
    if (MODE === 'GAS') {
      google.script.run.withSuccessHandler(terima).withFailureHandler(tolak).api(aksi, data);
    } else {
      if (!CFG.GAS_URL || CFG.GAS_URL.indexOf('/exec') < 0) { tolak(new Error('GAS_URL belum diisi di config.js')); return; }
      fetch(CFG.GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ aksi: aksi, data: data }), redirect: 'follow' })
        .then(function (res) { return res.json(); }).then(terima, tolak);
    }
  });
}
function galat(e) { toast((e && e.pesan) || 'Terjadi galat', 'galat'); }
function cekVersi(v) {

}

/** Kompres gambar di peramban (kanvas) → dataURL JPEG. */
function kompresGambar(berkas, maks, mutu) {
  return new Promise(function (ok, gagal) {
    if (!/^image\//.test(berkas.type)) return gagal({ pesan: 'Berkas bukan gambar.' });
    var url = URL.createObjectURL(berkas); var img = new Image();
    img.onload = function () {
      var w = img.naturalWidth, h = img.naturalHeight, r = Math.min(1, maks / Math.max(w, h));
      var c = document.createElement('canvas'); c.width = Math.round(w * r); c.height = Math.round(h * r);
      var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', mutu || .78));
    };
    img.onerror = function () { URL.revokeObjectURL(url); gagal({ pesan: 'Gambar tidak dapat dibaca (format HEIC? ubah ke JPG dulu).' }); };
    img.src = url;
  });
}

function unggahBerkas(dataUrl, nama, kemajuan) {
  var POT = 45000, bag = [];
  for (var i = 0; i < dataUrl.length; i += POT) bag.push(dataUrl.slice(i, i + POT));
  var mime = (/^data:([^;]+)/.exec(dataUrl) || [])[1] || '';
  return panggil('berkas_mulai', { ukuran: dataUrl.length, jumlah: bag.length, mime: mime, nama: nama }).then(function (r) {
    var id = r.id, n = 0;
    function lanjut() {
      if (n >= bag.length) { CACHE_MEDIA[id] = Promise.resolve(dataUrl); return '@@berkas:' + id; }
      return panggil('berkas_potong', { id: id, urutan: n, isi: bag[n] }).then(function () { n++; if (kemajuan) kemajuan(n / bag.length); return lanjut(); });
    }
    return lanjut();
  });
}

/* ---------------- CSV ---------------- */
function selCsv(v) { var s = String(v == null ? '' : v); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; }
function eksporCsv() {
  var kol = ['guest_id', 'nama_tamu', 'sapaan', 'kategori', 'subkategori', 'nomor_hp', 'jumlah_undangan', 'meja', 'alamat', 'status_kirim', 'status_buka', 'status_rsvp', 'jumlah_hadir', 'waktu_rsvp', 'status_checkin', 'waktu_checkin', 'souvenir', 'ucapan', 'catatan'];
  var baris = [kol.join(',')].concat((S.data.tamu || []).map(function (g) { return kol.map(function (k) { return selCsv(g[k]); }).join(','); }));
  var isi = '\uFEFF' + baris.join('\r\n'), a = S.data.acara || {};
  var nama = 'tamu-' + ((a.panggilan_pria || '') + '-' + (a.panggilan_wanita || '')).toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.csv';
  unduhTeks(nama, isi, 'text/csv;charset=utf-8');
  toast('CSV dibuat. Bila unduhan tidak muncul, gunakan tombol Salin.', '');
  modal('Ekspor CSV', '<p class="bantu">Berkas ' + esc(nama) + ' sedang diunduh. Di sebagian peramban (terutama di dalam Apps Script) unduhan diblokir; salin isinya lalu tempel ke Google Sheets / Excel.</p><div class="modal-kaki"><button class="tbl utama" id="sc">' + IK.salin + 'Salin CSV</button></div>');
  $('#sc').onclick = function () { salinTeks(isi.slice(1), 'CSV disalin'); };
}
function uraiCsv(teks) {
  var baris = [], sel = '', row = [], q = false;
  teks = teks.replace(/^\uFEFF/, '');
  var pemisah = (teks.split('\n')[0].match(/;/g) || []).length > (teks.split('\n')[0].match(/,/g) || []).length ? ';' : (teks.indexOf('\t') >= 0 && teks.split('\n')[0].indexOf(',') < 0 ? '\t' : ',');
  for (var i = 0; i < teks.length; i++) {
    var c = teks[i];
    if (q) { if (c === '"') { if (teks[i + 1] === '"') { sel += '"'; i++; } else q = false; } else sel += c; }
    else if (c === '"') q = true;
    else if (c === pemisah) { row.push(sel); sel = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && teks[i + 1] === '\n') i++; row.push(sel); sel = ''; if (row.some(function (x) { return x.trim(); })) baris.push(row); row = []; }
    else sel += c;
  }
  row.push(sel); if (row.some(function (x) { return x.trim(); })) baris.push(row);
  return baris;
}

    var det = ('BarcodeDetector' in window) ? new BarcodeDetector({ formats: ['qr_code'] }) : null, c = document.createElement('canvas'), jeda = 0;
